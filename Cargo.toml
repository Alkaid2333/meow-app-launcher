[package]
name = "meow-app-launcher"
version = "0.2.0"
edition = "2024"
description = "喵喵应用启动器 - 类 macOS 聚焦搜索的跨平台高性能应用启动器喵"
license = "MIT"

[[bin]]
name = "meowal"
path = "src/main.rs"

[dependencies]
# Skia 图形库的安全 Rust 绑定喵(Google Skia 官方图形引擎)
# binary-cache: 下载预编译二进制; embed-icudtl: 内嵌 ICU 数据(中文渲染无需外部文件)
skia-safe = "0.99"
logforth = { version = "0.30.1", features = ["starter-log"] }
colored = "3.1"
jiff = "0.2"
log = "0.4.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pinyin = "0.10"
# 异步运行时: 把应用扫描、图标提取等慢操作放到阻塞线程池,不阻塞 UI 消息循环喵
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
