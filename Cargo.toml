[package]
name = "meow-app-launcher"
version = "1.9.0"
edition = "2024"
description = "喵喵应用启动器 - 类 macOS 聚焦搜索的跨平台高性能应用启动器喵"
license = "MIT"

[[bin]]
name = "meowal"
path = "src/main.rs"

[features]
default = ["gl"]
# OpenGL 后端: 启用 skia 的 GPU 渲染能力(运行时仍可回退 CPU 光栅)喵
gl = ["skia-safe/gl"]

[build-dependencies]
# 把应用图标(app-icon.ico)嵌入 Windows exe 资源喵(MSVC 用 SDK 自带 rc.exe)喵
winres = "0.1"

[dependencies]
# Skia 图形库的安全 Rust 绑定喵(Google Skia 官方图形引擎)
# binary-cache: 下载预编译二进制; embed-icudtl: 内嵌 ICU 数据(中文渲染无需外部文件)
# 注: 本环境网络无法访问 github 预编译缓存,且未装 LLVM,故不开 svg feature(需换二进制),
# 图标走 render/svg.rs 内嵌轻量渲染喵
# gl 由 crate 特性 `gl` 透传启用(见 [features]),此处不直接写死喵
skia-safe = "0.99"
logforth = { version = "0.30.1", features = ["starter-log"] }
log = "0.4.27"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
pinyin = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_Ime",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_Storage_FileSystem",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_System_Console",
    "Win32_Media",
    # 剪贴板(CF 常量在 Ole 模块/GlobalAlloc 在 Memory)与系统命令(锁屏/睡眠/关机)喵
    "Win32_System_Ole",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Shutdown",
    "Win32_System_Power",
    # named-pipe IPC 服务端(CreateNamedPipeW/ConnectNamedPipe 等,ReadFile 需 IO)喵
    "Win32_System_Pipes",
    "Win32_System_IO",
    # 进程环境块同步(SetEnvironmentVariableW: 常驻进程要跟上用户改的环境变量)喵
    "Win32_System_Environment",
    # shell 指令输出按系统代码页解码(MultiByteToWideChar / GetOEMCP)喵
    "Win32_Globalization",
] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
